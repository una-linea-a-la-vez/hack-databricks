# Databricks App: el puente AR/VR servido desde el workspace, con URL HTTPS estable.
#
# Por que una App y no un portatil: la IP de una Wi-Fi cambia, no tiene TLS y se
# apaga al cerrar la tapa. Aqui la URL no cambia, va por HTTPS y corre al lado de
# los datos, asi que la latencia contra el indice y el warehouse es menor.
#
# La plataforma inyecta el puerto en DATABRICKS_APP_PORT y las credenciales del
# service principal en el entorno; data_pipeline/auth.py las detecta solo.
command:
  - uvicorn
  - ar_vr_bridge.app:app
  - --host
  - 0.0.0.0
  - --port
  - $DATABRICKS_APP_PORT

env:
  # Workspace dbc-61e43fe7-4c59 (migrado el 2026-10-04: el Free Edition agoto su computo).
  # rag_v1_idx: indice por trozos sobre documents_curated; el texto sale del propio indice.
  - name: VS_INDEX
    value: workspace.lab.rag_v1_idx
  - name: QUERIES_LOG
    value: "1"
  - name: RESEARCH_RECORD
    value: "1"
  - name: VS_KEEPWARM
    value: "1"
  # El orquestador real (agent_lab/runtime.py -> pivot-gateway). Sin esta variable
  # `mode: live` cae al simulador y lo anuncia. Requiere que el SP de esta app
  # (12912d7d-...) tenga CAN_USE sobre pivot-gateway; si no, el visor recibe un
  # evento error en cada pregunta live.
  - name: PIVOT_GATEWAY_URL
    value: "https://pivot-gateway-7474660394752821.aws.databricksapps.com"
